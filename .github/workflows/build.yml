name: Build IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      web_only:
        description: "Only build and test the web installer (uses the IPA from the latest release)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    if: ${{ !inputs.web_only }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project CertSigner.xcodeproj -scheme CertSigner \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/CertSigner.app Payload/
          zip -r CertSigner.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CertSigner-ipa
          path: CertSigner.ipa
      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -R "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create latest CertSigner.ipa -R "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "CertSigner (build ${{ github.run_number }})" \
            --notes "Unsigned build from commit ${{ github.sha }}. Install with FlareStore or any signer." \
            --latest

  # "Get CertSigner" web installer: zsign compiled to WebAssembly, tested by signing the IPA
  # built above. (Publishing to Pages and the Worker deploy are separate jobs below.)
  web:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unsigned IPA from this run
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: CertSigner-ipa
          path: web/site/app
      - name: Unsigned IPA from the latest release (web-only runs)
        if: needs.build.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download latest -R "${{ github.repository }}" -p CertSigner.ipa -D web/site/app
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - name: Cache OpenSSL for WebAssembly
        uses: actions/cache@v4
        with:
          path: .wasm-build/openssl
          key: openssl-wasm-3.3.2-emsdk-3.1.74-v1
      - name: Build the WebAssembly signer
        run: bash web/wasm/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser engines for the end-to-end test (Chromium + WebKit)
        run: |
          cd web
          npm install --no-save --silent playwright@1.65.0
          npx playwright install --with-deps chromium webkit
      - name: "Tests: sign the IPA in WebAssembly, the relay, the page in real browsers"
        run: |
          bash web/tests/make-fixtures.sh
          cd web && node --test tests/*.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-screenshots
          path: web/test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: web-site
          path: |
            web/site/wasm
            web/site/app

  # Install relay (Cloudflare Worker). Runs only on main and only when the repository has the
  # CLOUDFLARE_API_TOKEN secret; without it this job does nothing and the page offers the
  # signed IPA as a download instead of one-tap install.
  relay:
    needs: web
    if: ${{ always() && needs.web.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: deploy
        name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: bash worker/deploy.sh

  # Publishes the page, the WebAssembly signer and a same-origin copy of the unsigned IPA to GitHub Pages.
  pages:
    needs: [web, relay]
    if: ${{ always() && needs.web.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-site
          path: web/site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site
        env:
          RELAY_URL: ${{ needs.relay.outputs.url || vars.RELAY_URL }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: node web/scripts/prepare-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
