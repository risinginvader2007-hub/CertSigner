name: Build IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project CertSigner.xcodeproj -scheme CertSigner \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/CertSigner.app Payload/
          zip -r CertSigner.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CertSigner-ipa
          path: CertSigner.ipa
      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -R "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create latest CertSigner.ipa -R "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "CertSigner (build ${{ github.run_number }})" \
            --notes "Unsigned build from commit ${{ github.sha }}. Install with FlareStore or any signer." \
            --latest
