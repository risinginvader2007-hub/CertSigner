name: Signing test
on:
  # Only ui-overhaul: main only ever receives fast-forwards of commits already tested there,
  # so running it on main repeated the same test run. Start it by hand when needed.
  push:
    branches: [ui-overhaul]
  workflow_dispatch:

jobs:
  sign-multi-extension-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Make fixtures (2 extensions + framework + dylib, explicit mismatching profile)
        run: bash .github/scripts/make-signing-fixtures.sh "$RUNNER_TEMP/fixtures"
      - name: Release IPA (signed by the self-update tests like the in-app updater does)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download latest -R "${{ github.repository }}" -p CertSigner.ipa -O "$RUNNER_TEMP/fixtures/certsigner.ipa" || echo "no release IPA; those tests will skip"
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run signing pipeline tests in the simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator: $UDID"
          TEST_RUNNER_CS_FIXTURES="$RUNNER_TEMP/fixtures" xcodebuild test \
            -project CertSigner.xcodeproj -scheme SigningTests -destination "id=$UDID" \
            -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$RUNNER_TEMP/test.log" | tail -n 60
          status=${PIPESTATUS[0]}
          echo "=== every test result and measurement ==="
          grep -E "Test Case .*(passed|failed)|PERF |theme fade|: error:" "$RUNNER_TEMP/test.log" || true
          exit $status
      - name: Inspect the signed IPA (Compatibility)
        run: |
          set -e
          F="$RUNNER_TEMP/fixtures"
          echo "=== signing log ==="; cat "$F/compat.ipa.log"
          mkdir -p "$F/out" && cd "$F/out" && unzip -q -o ../compat.ipa
          APP=Payload/Multi.app
          echo "=== PlugIns in signed IPA ==="; ls -la "$APP/PlugIns"
          test -d "$APP/PlugIns/Share.appex" && test -d "$APP/PlugIns/Widget.appex"
          echo "=== bundle IDs (unchanged) ==="
          for b in "$APP" "$APP/PlugIns/Share.appex" "$APP/PlugIns/Widget.appex"; do
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$b/Info.plist"
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.husk.test"
          echo "=== code signatures ==="
          for item in "$APP" "$APP/PlugIns/Share.appex" "$APP/PlugIns/Widget.appex" "$APP/Frameworks/Kit.framework" "$APP/Frameworks/libextra.dylib"; do
            echo "--- $item"
            codesign -dvv "$item" 2>&1 | grep -E "^(Identifier|Authority|TeamIdentifier|CodeDirectory)" || { echo "NOT SIGNED: $item"; exit 1; }
          done
          echo "=== embedded profiles ==="; find Payload -name embedded.mobileprovision
      - name: Inspect the signed release IPA (updater path)
        run: |
          set -e
          F="$RUNNER_TEMP/fixtures"
          if [ ! -f "$F/self-update.ipa" ]; then echo "no self-update.ipa (release IPA missing)"; exit 0; fi
          mkdir -p "$F/self-out" && cd "$F/self-out" && unzip -q -o ../self-update.ipa
          APP=Payload/CertSigner.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.other.app"
          for item in "$APP" "$APP/Frameworks/OpenSSL.framework"; do
            echo "--- $item"
            codesign -dvv "$item" 2>&1 | grep -E "^(Identifier|Authority|TeamIdentifier)" || { echo "NOT SIGNED: $item"; exit 1; }
          done
      - name: Signing logs (always)
        if: always()
        run: |
          echo "=== Compatibility log ==="; cat "$RUNNER_TEMP/fixtures/compat.ipa.log" || true
          echo; echo "=== Strict log (expected to stop at the mismatch) ==="; cat "$RUNNER_TEMP/fixtures/strict.ipa.log" || true
          echo; echo "=== Release IPA, normal job ==="; cat "$RUNNER_TEMP/fixtures/self-normal.ipa.log" || true
          echo; echo "=== Release IPA, updater ==="; cat "$RUNNER_TEMP/fixtures/self-update.ipa.log" || true
