name: CertSigner
options:
  deploymentTarget:
    iOS: "16.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
  OpenSSL:
    url: https://github.com/krzyzanowskim/OpenSSL
    from: 3.3.0
targets:
  # Vendored zsign (C++) + Objective-C++ wrapper, built as a static library.
  ZSign:
    type: library.static
    platform: iOS
    sources:
      - path: Vendor/zsign
        excludes: [LICENSE]
      - path: Vendor/ZSignBridge
    dependencies:
      - package: OpenSSL
    settings:
      base:
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
        CLANG_CXX_LIBRARY: libc++
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "ZSIGN_IOS=1"]
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor/zsign", "$(SRCROOT)/Vendor/zsign/common", "$(SRCROOT)/Vendor/ZSignBridge"]
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        SKIP_INSTALL: YES
  CertSigner:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: ZIPFoundation
      - package: OpenSSL
      - target: ZSign
    # XcodeGen writes this plist at generate time; Xcode merges the INFOPLIST_KEY_* settings into it.
    info:
      path: Support/Info.plist
      properties:
        LSSupportsOpeningDocumentsInPlace: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS App
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.itunes.ipa, com.certsigner.ipa]
          - CFBundleTypeName: Signing Certificate
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.rsa.pkcs-12, com.certsigner.p12]
          - CFBundleTypeName: Provisioning Profile
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.mobileprovision, com.certsigner.mobileprovision]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.certsigner.ipa
            UTTypeDescription: iOS App Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [ipa]
          - UTTypeIdentifier: com.certsigner.p12
            UTTypeDescription: PKCS 12 Certificate
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [p12, pfx]
          - UTTypeIdentifier: com.certsigner.mobileprovision
            UTTypeDescription: Provisioning Profile
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [mobileprovision]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.certsigner.app
        PRODUCT_NAME: CertSigner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CertSigner
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging/CertSigner-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Vendor/ZSignBridge"]
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Sunset AppIcon-Mint AppIcon-Midnight"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
  # Unit tests (simulator): run the real signing pipeline on generated fixtures (see .github/workflows/signing-test.yml).
  CertSignerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: CertSigner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.certsigner.app.tests
        SWIFT_VERSION: "5.0"
schemes:
  # Explicit app scheme (same as the one Xcode generated implicitly) so adding a test scheme doesn't change the IPA build.
  CertSigner:
    build:
      targets:
        CertSigner: all
    run:
      config: Debug
    archive:
      config: Release
  SigningTests:
    build:
      targets:
        CertSigner: [test]
        CertSignerTests: [test]
    test:
      config: Debug
      targets: [CertSignerTests]
